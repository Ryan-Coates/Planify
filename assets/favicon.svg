<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Calendar body -->
  <rect x="2" y="7" width="28" height="23" rx="4" fill="#4a6cf7"/>
  <!-- Header bar -->
  <rect x="2" y="7" width="28" height="10" rx="4" fill="#7986f5"/>
  <rect x="2" y="13" width="28" height="4" fill="#7986f5"/>
  <!-- Ring pegs -->
  <rect x="10" y="4" width="3" height="7" rx="1.5" fill="#fff"/>
  <rect x="19" y="4" width="3" height="7" rx="1.5" fill="#fff"/>
  <!-- Day cells row 1 -->
  <rect x="6"  y="20" width="4.5" height="4" rx="1" fill="#ffffff" opacity="0.7"/>
  <rect x="13.5" y="20" width="5" height="4" rx="1" fill="#ffd166"/>
  <rect x="21.5" y="20" width="4.5" height="4" rx="1" fill="#ffffff" opacity="0.7"/>
  <!-- Day cells row 2 -->
  <rect x="6"  y="26" width="4.5" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="13.5" y="26" width="5" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
  <rect x="21.5" y="26" width="4.5" height="3" rx="1" fill="#ffffff" opacity="0.4"/>
</svg>
